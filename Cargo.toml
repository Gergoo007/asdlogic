[package]
name = "turiplogic"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = "1.25.0"
dear-imgui-rs = "0.10.4"
env_logger = "0.11.10"
glam = { version = "0.32.1", features = ["mint", "serde"] }
imgui = "0.12.0"
imgui-wgpu = "0.28.0"
imgui-winit-support = "0.13.0"
mint = "0.5.9"
palette = "0.7.6"
pollster = "0.4.0"
rfd = "0.17.2"
rmp = "0.8.15"
rmp-serde = "1.3.1"
serde = { version = "1.0.228", features = [ "derive" ] }
strum = { version = "0.28", features = ["derive"] }
typed-generational-arena = { version = "0.2.9", features = [ "serde" ] }
wgpu = "29.0.1"
winit = "0.30.13"

[profile.release]
# debug = true
panic = "abort"

[profile.dev]
panic = "abort"
